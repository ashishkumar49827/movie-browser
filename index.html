<style>
:root{--ink:#251f21;--ink2:#585254;--teal:#73a89a;--hair:#eae9ea;--raised:#f4efec;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;background:var(--raised);color:var(--ink);padding-bottom:60px;}
.wrap{max-width:1040px;margin:0 auto;background:#fff;min-height:100vh;padding:20px 20px 40px;}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:8px 0 4px}
.fact{color:var(--teal);font-weight:600;font-size:14px;margin-bottom:10px}
.intro{font-size:14px;line-height:22px;color:var(--ink);margin-bottom:18px}
.search{width:100%;font-size:15px;padding:12px 14px;border:1px solid var(--hair);border-radius:8px;margin:6px 0 18px}
.group{margin-bottom:22px}
.group h2{font-size:19px;font-weight:600;margin-bottom:10px}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
.card{flex:0 0 118px;width:118px;background:none;border:none;text-align:left;cursor:pointer;font:inherit;color:inherit;scroll-snap-align:start;display:flex;flex-direction:column;gap:4px}
.card img{width:118px;height:177px;object-fit:cover;border-radius:12px;background:var(--raised)}
.card .n{font-size:12px;line-height:16px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border:none;border-top:1px solid var(--hair);background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.line:first-child{border-top:none}
.line img{width:40px;height:60px;object-fit:cover;border-radius:4px;background:var(--raised);flex:none}
.line .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.line .n{font-weight:600}
.line .d{font-size:12px;color:var(--ink2)}
.free{margin-left:auto;font-size:12px;font-weight:600;color:var(--teal);white-space:nowrap}
.back{background:#fff;border:1px solid var(--hair);border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:14px}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:14px}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player:fullscreen,.player:-webkit-full-screen{border-radius:0;aspect-ratio:auto;margin:0}
.player{touch-action:pan-y}
.player:fullscreen.fill,.player:-webkit-full-screen.fill{background:#000}
.player:fullscreen.fill iframe,.player:-webkit-full-screen.fill iframe{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%)}
.fsrow{display:flex;gap:8px;margin:-6px 0 14px}
.fsrow .fsbtn{flex:1;margin:0}
.fsbtn{display:block;background:#000;color:#fff;border:1px solid var(--hair);border-radius:8px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
.hero{display:flex;gap:16px;margin-bottom:14px}
.hero img{width:120px;height:180px;object-fit:cover;border-radius:12px;background:var(--raised)}
.facts{font-size:14px;line-height:22px;color:var(--ink2)}
.facts b{color:var(--ink)}
.ytlink{display:inline-block;margin-top:10px;color:var(--teal);font-weight:600;font-size:14px;text-decoration:none}
.note{font-size:12px;color:var(--ink2);margin-top:8px;line-height:18px}
@media(min-width:768px){.card{flex-basis:150px;width:150px}.card img{width:150px;height:225px}.hero img{width:180px;height:270px}}
</style>
</head>

const BY_ID = Object.fromEntries(DATA.movies.map(m=>[m.id,m]));
const norm = s => s.toLowerCase().replace(/[^a-z0-9\u0900-\u097f ]/g,' ').replace(/\s+/g,' ').trim();
const app = document.getElementById('app');
let q = '';
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function fmtDur(min){return min>=60? Math.floor(min/60)+' gh '+(min%60)+' min' : min+' min';}
function home(){
  let h = `<h1>Movie Browser</h1><div class="fact">${DATA.movies.length} movies · sab free</div>
  <p class="intro">Official studio channels ki full movies, app ke andar hi chalao - na koi subscription, na koi card. Naam likh kar dhundo ya neeche se chuno.</p>
  <input class="search" id="q" placeholder="Movie ka naam likho" value="${esc(q)}" autocomplete="off">`;
  const n = norm(q);
  if(n){
    const res = DATA.movies.filter(m=>norm(m.title).includes(n)).slice(0,20);
    h += `<div class="group"><h2>${res.length? res.length+' natije' : 'Kuch nahi mila'}</h2>`;
    h += res.length ? res.map(m=>`<button class="line" onclick="open_('${m.id}')"><img loading="lazy" src="posters/${m.id}.jpg" alt=""><span class="t"><span class="n">${esc(m.title)}</span><span class="d">${esc([m.year,m.ch].filter(Boolean).join(' · '))}</span></span><span class="free">Free</span></button>`).join('') : `<p class="intro">Is naam se koi movie nahi mili. Spelling badal kar dekho.</p>`;
    h += `</div>`;
  } else {
    for(const r of DATA.rows){
      h += `<div class="group"><h2>${esc(r.label)}</h2><div class="strip">` + r.ids.map(id=>{const m=BY_ID[id];return m?`<button class="card" onclick="open_('${m.id}')"><img loading="lazy" src="posters/${m.id}.jpg" alt="${esc(m.title)} poster"><span class="n">${esc(m.title)}</span><span class="m">${esc(m.year||m.ch)}</span></button>`:''}).join('') + `</div></div>`;
    }
  }
  h += `<p class="note">Movies official YouTube channels se free hain; 3 Nov 2026 ko check kiya gaya.</p>`;
  app.innerHTML = h;
  const inp = document.getElementById('q');
  inp.addEventListener('input', e=>{ q = e.target.value; home(); const i=document.getElementById('q'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); });
}
let CUR=null;
function goFS(){
  const p=document.querySelector('.player'); if(!p) return;
  const d=document;
  if(d.fullscreenElement||d.webkitFullscreenElement){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); return; }
  const req=p.requestFullscreen||p.webkitRequestFullscreen;
  if(req){ try{const r=req.call(p); if(r&&r.catch)r.catch(()=>{});}catch(e){} }
  else if(CUR&&CUR.yt){ window.open(CUR.yt,'_blank'); }
}
function updBtns(){
  const p=document.querySelector('.player'); const b=document.getElementById('fillbtn');
  if(b) b.innerHTML = (p&&p.classList.contains('fill')) ? '&#x2922; Fit karo' : '&#x2922; Fill screen';
}
function fitFill(){
  const p=document.querySelector('.player.fill'); if(!p) return;
  const f=p.querySelector('iframe'); if(!f) return;
  const vw=p.clientWidth, vh=p.clientHeight, ar=16/9; let w,h;
  if(vw/vh > ar){ w=vw; h=Math.round(vw/ar); } else { h=vh; w=Math.round(vh*ar); }
  f.style.width=w+'px'; f.style.height=h+'px';
}
function clearFill(){
  const p=document.querySelector('.player'); if(!p) return;
  p.classList.remove('fill');
  const f=p.querySelector('iframe'); if(f){ f.style.width=''; f.style.height=''; }
  updBtns();
}
function reqFS(p){
  const req=p.requestFullscreen||p.webkitRequestFullscreen; if(!req) return null;
  try{ return req.call(p); }catch(e){ return null; }
}
function goFill(force){
  const p=document.querySelector('.player'); if(!p) return;
  const d=document;
  const fsEl=d.fullscreenElement||d.webkitFullscreenElement;
  const want=(force!==undefined)?force:!p.classList.contains('fill');
  if(want){
    p.classList.add('fill');
    if(!fsEl){ const r=reqFS(p); if(r&&r.then){ r.then(fitFill).catch(()=>{}); } }
    fitFill();
  } else {
    clearFill();
  }
  updBtns();
}
function goRotate(){
  const p=document.querySelector('.player'); if(!p) return;
  const d=document; const so=screen.orientation||{};
  const fsEl=d.fullscreenElement||d.webkitFullscreenElement;
  const doLock=()=>{
    if(!so.lock) return;
    const t=(so.type&&so.type.indexOf('landscape')===0)?'portrait':'landscape';
    try{ const r=so.lock(t); if(r&&r.catch) r.catch(()=>{}); }catch(e){}
  };
  if(!fsEl){ const r=reqFS(p); if(r&&r.then){ r.then(doLock).catch(()=>{}); } }
  else doLock();
}
function attachPinch(p){
  if(!p||p._pinch) return; p._pinch=1;
  let d0=0;
  const dist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  p.addEventListener('touchstart',e=>{ if(e.touches.length===2) d0=dist(e.touches[0],e.touches[1]); },{passive:true});
  p.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&d0>0){
      const r=dist(e.touches[0],e.touches[1])/d0;
      if(r>1.4){ goFill(true); d0=0; }
      else if(r<0.72){ goFill(false); d0=0; }
      e.preventDefault();
    }
  },{passive:false});
  p.addEventListener('touchend',e=>{ if(e.touches.length<2) d0=0; },{passive:true});
}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{
  const d=document; const fsEl=d.fullscreenElement||d.webkitFullscreenElement;
  if(!fsEl){
    clearFill();
    if(screen.orientation&&screen.orientation.unlock){ try{screen.orientation.unlock();}catch(e){} }
  } else {
    fitFill();
  }
  updBtns();
}));
window.addEventListener('resize',()=>fitFill());
window.addEventListener('orientationchange',()=>setTimeout(fitFill,300));
function open_(id){
  const m = BY_ID[id]; if(!m) return; CUR=m;
  app.innerHTML = `<button class="back" onclick="home()">&#8592; Wapas list me</button>
  <h1>${esc(m.title)}</h1>
  <div class="fact">${esc([m.year,m.genre].filter(Boolean).join(' · '))||'Full movie'}</div>
  <div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${m.id}?rel=0&fs=1&playsinline=1" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen webkitallowfullscreen mozallowfullscreen title="${esc(m.title)}"></iframe></div>
  <div class="fsrow">
  <button class="fsbtn" onclick="goFS()">&#x26F6; Full screen</button>
  <button class="fsbtn" id="fillbtn" onclick="goFill()">&#x2922; Fill screen</button>
  <button class="fsbtn" onclick="goRotate()">&#x1F504; Landscape</button>
  </div>
  <div class="hero"><img src="posters/${m.id}.jpg" alt="${esc(m.title)} poster"><div class="facts">
  <div><b>Channel:</b> ${esc(m.ch)} (official)</div>
  ${m.runtime?`<div><b>Lambai:</b> ${fmtDur(m.runtime)}</div>`:''}
  ${m.rating?`<div><b>Rating:</b> ${esc(m.rating)}</div>`:''}
  ${m.director?`<div><b>Director:</b> ${esc(m.director)}</div>`:''}
  <a class="ytlink" href="${m.yt}" target="_blank" rel="noopener">YouTube app me kholo &#8599;</a>
  <p class="note">Agar video na chale to channel ne embedding band rakhi hai - upar YouTube link se dekho.</p>
  </div></div>
  ${m.desc?`<p class="intro">${esc(m.desc)}</p>`:''}`;
  window.scrollTo(0,0);
  attachPinch(document.querySelector('.player'));
  updBtns();
}
home();
</script>
